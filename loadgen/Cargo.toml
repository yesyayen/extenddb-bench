[package]
name = "extenddb-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Open-loop load generator for the ExtendDB perf POC"
license = "Apache-2.0"

[[bin]]
name = "extenddb-bench"
path = "src/main.rs"

[dependencies]
# CLI + async runtime
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
async-trait = "0.1"

# AWS SDK (DynamoDB wire protocol; SigV4 for free)
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-credential-types = "1.2"
aws-sdk-dynamodb = "1.55"
aws-sdk-s3 = "1.55"
# Custom HTTP client for self-signed TLS (skip-verify or custom CA bundle).
# The AWS SDK 1.x default builder for hyper is gated on hyper 0.14.
aws-smithy-runtime = { version = "1.7", features = ["connector-hyper-0-14-x"] }
hyper = { version = "0.14", features = ["client"] }
hyper-rustls = { version = "0.25", default-features = false, features = ["http1", "http2", "native-tokio", "rustls-native-certs"] }
rustls = { version = "0.22", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2.0"
rustls-pki-types = "1"
rustls-native-certs = "0.7"
webpki-roots = "0.26"

# Open-loop rate limit
governor = "0.6"
nonzero_ext = "0.3"

# Histograms
hdrhistogram = "7.5"

# Random key generation
fastrand = "2.1"

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }

# Output formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Process self-monitoring (LG saturation safety belt)
sysinfo = "0.31"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
